[project]
name = "discord-mcp"
version = "0.1.0"
description = "MCP server for Discord bot operations via discord.py"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "discord.py>=2.4.0",
    "pydantic>=2.0.0",
]

[project.scripts]
discord-mcp = "discord_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
